name: Publish

# Tag v1.2.3 to publish a release, v1.2.3-beta.1 or v1.2.3-alpha.1 for the matching channel.
# Push to the prototype branch (or run this by hand) to publish an alpha build of whatever is on it.
on:
  push:
    tags: ['v*']
    branches: [prototype]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      modrinth-url: ${{ steps.upload.outputs.modrinth-url }}
      curseforge-url: ${{ steps.upload.outputs.curseforge-url }}
      version: ${{ steps.meta.outputs.version }}
      type: ${{ steps.meta.outputs.type }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A release tag needs a complete, signed record from the stability contract (docs/STABILITY.md).
      # Alpha and beta tags and prototype builds are not gated.
      - name: Check the stability sign-off
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') }}
        run: |
          f="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$f" ]; then
            echo "::error::No sign-off record at $f. Copy docs/releases/TEMPLATE.md and complete it (docs/STABILITY.md)."
            exit 1
          fi
          if grep -n '\[ \]' "$f"; then
            echo "::error::$f still has unticked boxes (listed above). Tick, mark n/a with a reason, or list under Exceptions."
            exit 1
          fi
          name=$(awk '/^## Signed off/{on=1; next} on && /^By:/{sub(/^By:[ \t]*/, ""); print; exit}' "$f" | tr -d '[:space:]')
          if [ -z "$name" ]; then
            echo "::error::$f is not signed (fill in the name after 'By:' under 'Signed off')."
            exit 1
          fi
          echo "Sign-off record $f is complete."

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version and channel
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            case "$version" in
              *alpha*) type=alpha ;;
              *beta*|*rc*) type=beta ;;
              *) type=release ;;
            esac
            previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          else
            base=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
            version="${base}-prototype.${GITHUB_RUN_NUMBER}"
            type=alpha
            previous=$(git describe --tags --abbrev=0 2>/dev/null || true)
          fi
          range="${previous:+$previous..}HEAD"
          minecraft=$(sed -n 's/^minecraft_version=//p' gradle.properties | tr -d '\r')
          {
            echo "version=$version"
            echo "jar=create_engines-$version-$minecraft.jar"
            echo "type=$type"
            echo "changelog<<CHANGELOG_EOF"
            # Prefer the hand-written section in docs/LISTING.md; fall back to commit subjects
            notes=$(awk -v v="$version" '$0 == "## Changelog for " v {on=1; next} /^## /{on=0} on' docs/LISTING.md)
            if [ -n "$(echo "$notes" | tr -d '[:space:]')" ]; then
              echo "$notes"
            else
              git log "$range" --no-merges --format='- %s'
            fi
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./gradlew build -Pmod_version=${{ steps.meta.outputs.version }} --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: create_engines-${{ steps.meta.outputs.version }}
          path: build/libs/${{ steps.meta.outputs.jar }}

      - name: Publish to Modrinth and CurseForge
        id: upload
        uses: Kira-NT/mc-publish@v3.3.2
        with:
          modrinth-id: ${{ vars.MODRINTH_ID || 'create-engine-engineer' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: build/libs/${{ steps.meta.outputs.jar }}
          name: Create Engine Engineer ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          version-type: ${{ steps.meta.outputs.type }}
          changelog: ${{ steps.meta.outputs.changelog }}

          loaders: neoforge
          # CurseForge refuses a file with no environment; the mod is required on both sides
          environment: client | server
          game-versions: 1.21.1
          java: 21
          dependencies: |
            create(required){modrinth:LNytGWDc}{curseforge:328085}

          # Try every site, then fail the run if any refused: a Modrinth problem must not hold up CurseForge
          fail-mode: skip

  # Each site gets its own job so GitHub lists it under Deployments with a link to the uploaded file.
  # The upload step fails the publish job when one site refuses, so these must run regardless.
  modrinth:
    needs: publish
    if: ${{ !cancelled() && needs.publish.outputs.modrinth-url != '' }}
    runs-on: ubuntu-latest
    environment:
      name: Modrinth
      url: ${{ needs.publish.outputs.modrinth-url }}
    steps:
      - run: echo "${{ needs.publish.outputs.modrinth-url }}"

  curseforge:
    needs: publish
    if: ${{ !cancelled() && needs.publish.outputs.curseforge-url != '' }}
    runs-on: ubuntu-latest
    environment:
      name: CurseForge
      url: ${{ needs.publish.outputs.curseforge-url }}
    steps:
      - run: echo "${{ needs.publish.outputs.curseforge-url }}"

  # A tag also gets a GitHub release with the jar and the same notes the sites got.
  release:
    needs: publish
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: create_engines-${{ needs.publish.outputs.version }}
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
          CHANNEL: ${{ needs.publish.outputs.type }}
        run: |
          awk -v v="$VERSION" '$0 == "## Changelog for " v {on=1; next} /^## /{on=0} on' docs/LISTING.md > notes.md
          [ -s notes.md ] || echo "Release $VERSION" > notes.md
          flags=()
          [ "$CHANNEL" = release ] || flags+=(--prerelease)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.jar --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.jar --title "Create Engine Engineer $VERSION" --notes-file notes.md "${flags[@]}"
          fi
