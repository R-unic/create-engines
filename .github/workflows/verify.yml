name: Verify

# The checks that need no game window (docs/ROADMAP.md, Verification track). The unit tests include the architecture
# rules, the config matrix, the property tests and the performance budgets. The GameTests and the client audit are
# run by hand through `./gradlew smoke` as part of the release gate (docs/STABILITY.md).
on:
  push:
    branches: [master, prototype]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and the coverage ratchet
        run: ./gradlew check
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/jacoco/test/html
          if-no-files-found: ignore

  # Generated files may never drift from the code that makes them or be committed half updated: runData must leave
  # src/generated exactly as committed.
  datagen-idempotence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Regenerate the data
        run: ./gradlew runData
      - name: Fail if anything changed
        run: |
          # The .cache folder is datagen's own bookkeeping and is excluded from the jar and from this check.
          git add --intent-to-add --all src/generated
          if ! git diff --exit-code --stat -- src/generated ':(exclude)src/generated/resources/.cache'; then
            echo "::error::runData changed files under src/generated. Run ./gradlew runData and commit the result."
            exit 1
          fi
