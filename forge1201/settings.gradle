pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// The Forge 1.20.1 port (a spike). A build of its own, so the main NeoForge build is untouched; it shares the simulation.
rootProject.name = 'create-engines-forge-1-20-1'

include 'sim'
project(':sim').projectDir = file('../sim')
