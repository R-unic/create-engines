# Create: Engine Engineer, preset "Expert": thirstier engines, a longer crank costs more rating, precision parts matter a little
# more, and the exhaust heat exchanger gives less. Everything that can go wrong in the default balance still can.
#
# How to use a preset: stop the game, open the world's serverconfig/create_engines-server.toml, and copy the [balance] and
# [features] tables from here over the ones there (leave [engine], the calibration, alone). A modpack can ship the same
# tables in its defaultconfigs folder. Every key here is an existing setting: a preset adds no dial of its own.

[balance]
	fuelConsumption = 1.5
	precisionBonus = 1.25
	boostStrength = 1.0
	rotaryPower = 1.0
	heatRecoveryOutput = 0.75
	coolingBonus = 1.0
	torsionalFlex = 1.5
	alternatorEnergy = 2.0

[features]
	forcedInduction = true
	sparkFouling = true
	oilDilution = true
	oilAgeing = true
	engineTemperature = true
	pilotInjection = true
	rotaryEngines = true
	heatRecovery = true
