org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Mappings - https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Matches the NeoForge version Create 6.0.10 is built against
neo_version=21.1.228
# The oldest NeoForge the mod itself accepts (what 1.x shipped with). The build runs a newer one for Create Aeronautics 1.3.2 and Sable,
# which must not raise what players need.
neo_min_version=21.1.219
loader_version_range=[1,)

# Create and the libraries it pins (see Create's gradle.properties at tag mc1.21.1-6.0.10)
# https://maven.createmod.net/com/simibubi/create/create-1.21.1/
create_version=6.0.10-281
create_version_range=[6.0.10,6.1)
ponder_version=1.0.82
flywheel_version=1.0.6
# Only the compatibility matrix loads Sodium (docs/COMPAT.md)
sodium_version=0.8.13+mc1.21.1
registrate_version=MC1.21-1.3.0+67

# Recipe viewers. The mod compiles against their APIs only (client/compat); it needs neither at runtime. The compatibility
# matrix loads each one (docs/COMPAT.md).
jei_version=19.70.0.469
emi_version=1.1.24+1.21.1

# Script and computer integrations (compat/kubejs, compat/computercraft). Compiled against only; the mod needs neither at runtime.
# The compatibility matrix loads each one (docs/COMPAT.md).
kubejs_version=2101.7.2-build.382
rhino_version=2101.2.7-build.81
# 1.121 needs NeoForge 21.1.265 or newer; this project builds against 21.1.219, and 1.120.2 is the newest that loads on it
cc_tweaked_version=1.120.2

# Curios, for the headphones' Curios head slot (compat/curios). Compiled against the API only; the mod does not need it at runtime.
# The compatibility matrix loads it (docs/COMPAT.md). 9.5.1 is the build this was written against; 9.6.0 is newer and not tried.
curios_version=9.5.1+1.21.1

# Create Aeronautics and Sable, loaded by the compatibility matrix only (docs/COMPAT.md). These are Modrinth version ids.
# Aeronautics 1.3.2 (the bundled jar: Simulated, Aeronautics, Offroad) and Sable 2.0.6 ask for NeoForge 21.1.228 and Create 6.0.10;
# they crash on Create 6.0.11 (Simulated targets NixieTubeBlock.getPower, which 6.0.11 lacks).
aeronautics_version=44pLdPGg
sable_version=fg9dTRz9

# Mod
mod_id=create_engines
mod_name=Create: Engine Engineer
mod_license=MIT
mod_version=2.4.0
mod_group_id=com.createengines

# Pollution of the Realms (mod id adpother) and the library it needs, from Modrinth's maven by version id. Compiled against, never required.
pollution_version=4c797aEW
endertech_version=ZVYWvUbW

# More compatibility-matrix rows (docs/COMPAT.md), all Modrinth version ids and all loaded by the matrix only, never required. Jade is also
# compiled against (compat/jade). Create Crafts & Additions 1.6.0 is the newest that accepts NeoForge 21.1.219 and up (1.7.x asks for 21.1.248).
jade_version=eYz2YBGT
iris_version=KduFYu4t
sound_physics_version=85fA7L1W
cloth_config_version=izKINKFg
ambient_sounds_version=WGalCQAo
creative_core_version=aoWQBRG8
create_additions_version=qPr8V4G2
tfmg_version=o8aSx7yp
