plugins {
    id 'java-library'
    id 'idea'
    id 'jacoco'
    id 'net.neoforged.moddev' version '2.0.148'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// Names the jar create_engines-VERSION-MCVERSION.jar. The version the game sees is mod_version alone (see generateModMetadata).
version = "${mod_version}-${minecraft_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// The harnesses that test the mod (GameTests, smoke audits, the picture-taking runs) are for development. The jar a player or
// a server loads leaves them out; the development runs use the classes folder, so they still have them (PackagedJarTest
// checks the jar, and CreateEnginesClient registers these by name so a jar without them starts).
tasks.named('jar', Jar) {
    exclude 'com/createengines/gametest/**', 'com/createengines/smoke/**', 'com/createengines/client/smoke/**',
        'com/createengines/client/VisualSmokeTest*', 'com/createengines/client/ShowcaseRun*'
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

repositories {
    maven { url = 'https://maven.createmod.net' } // Create, Ponder, Flywheel
    maven { url = 'https://maven.ithundxr.dev/snapshots' } // Registrate
    maven { // Sodium, for the compatibility matrix only
        name = 'CaffeineMC'
        url = 'https://maven.caffeinemc.net/releases'
        content { includeGroup 'net.caffeinemc' }
    }
    maven { // JEI, for the recipe viewer plugin and its compatibility row
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev' // JEI's own libraries, which its runtime pulls in
            includeGroup 'net.mezzdev.config'
        }
    }
    maven { // EMI, likewise
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
        content { includeGroup 'dev.emi' }
    }
    maven { // KubeJS and Rhino, for the script integration and its compatibility row
        name = 'Latvian'
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
            includeGroup 'dev.latvian.apps'
        }
    }
    maven { // CC: Tweaked, for the computer peripheral and its compatibility row
        name = 'SquidDev'
        url = 'https://maven.squiddev.cc'
        content { includeGroup 'cc.tweaked' }
    }
    maven { // Curios, for the headphones' Curios slot and its compatibility row
        name = 'Illusive Soulworks'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven { // Create Aeronautics and Sable, for the compatibility matrix only (Modrinth's maven, version ids)
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

// Only the compatibility-matrix Sodium run loads this; the mod itself does not depend on Sodium. Declared before the runs that use it.
configurations.create('sodiumRuntime')
// Likewise the JEI and EMI compatibility rows: each loads one recipe viewer and nothing else changes.
configurations.create('jeiRuntime')
configurations.create('emiRuntime')
// And the KubeJS and CC: Tweaked rows.
configurations.create('kubejsRuntime')
configurations.create('ccRuntime')
// And the Curios row (the headphones in a Curios head slot).
configurations.create('curiosRuntime')
// And the Create Aeronautics row (with Sable, which it needs).
configurations.create('aeronauticsRuntime')
// And the Pollution of the Realms GameTest run (with the library it needs).
configurations.create('pollutionRuntime')
// And the Jade row, the Iris row (which also loads Sodium, see below), and the two sound rows.
configurations.create('jadeRuntime')
configurations.create('irisRuntime')
configurations.create('soundPhysicsRuntime')
configurations.create('ambientSoundsRuntime')
// And the GameTest run with other mods' energy blocks loaded: Create Crafts & Additions (Mekanism and Create: New Age were tried and left out).
configurations.create('energyRuntime')
// And the GameTest run with Create: The Factory Must Grow (Community Edition) loaded: its fluids must run an engine.
configurations.create('tfmgRuntime')
// And the GameTest run with Create Aeronautics and Sable loaded (engines on a moving structure).
def sableJar = configurations.getByName('aeronauticsRuntime')
tasks.register('extractSableCompanion', Copy) {
    from({ zipTree(sableJar.incoming.files.filter { it.name.startsWith('sable') }.singleFile) }) {
        include 'META-INF/jarjar/sable-companion*.jar'
        eachFile { it.path = 'sable-companion.jar' }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('sable')
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Builds the test engine in a fresh world, screenshots it from fixed viewpoints, then quits.
        visualSmokeTest {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'create_engines.visualSmokeTest', 'true'
            systemProperty 'create_engines.visualSmokeTest.scenes', project.hasProperty('smokeScenes') ? 'true' : 'false'
            systemProperty 'create_engines.visualSmokeTest.rotary', project.hasProperty('smokeRotary') ? 'true' : 'false'
            systemProperty 'create_engines.visualSmokeTest.newParts', project.hasProperty('smokeNewParts') ? 'true' : 'false'
            systemProperty 'create_engines.visualSmokeTest.effects', project.hasProperty('smokeEffects') ? 'true' : 'false'
            systemProperty 'create_engines.visualSmokeTest.pushrods', project.hasProperty('smokePushrods') ? 'true' : 'false'
            systemProperty 'create_engines.visualSmokeTest.casings', project.hasProperty('smokeCasings') ? 'true' : 'false'
            systemProperty 'create_engines.visualSmokeTest.rainCap', project.hasProperty('smokeRainCap') ? 'true' : 'false'
            systemProperty 'create_engines.visualSmokeTest.refinery', project.hasProperty('smokeRefinery') ? 'true' : 'false'
            systemProperty 'create_engines.visualSmokeTest.window', project.hasProperty('smokeWindow') ? 'true' : 'false'
        }

        // The unattended client audit (see docs/SMOKE.md): content, models, Ponder, a running fleet, leaks, pictures.
        // Runs in a game folder of its own, so it starts from default settings and never touches a development client's.
        smokeAudit {
            client()
            gameDirectory = file('run/smoke-client')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'create_engines.smokeAudit', 'true'
        }

        // Compatibility matrix rows (docs/COMPAT.md): the same client audit with Flywheel switched off, and with Sodium
        // loaded. Each has a game folder of its own so a row's settings and log never leak into another's.
        smokeAuditFlywheelOff {
            client()
            gameDirectory = file('run/smoke-client-flywheel-off')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'create_engines.smokeAudit', 'true'
        }

        smokeAuditSodium {
            client()
            gameDirectory = file('run/smoke-client-sodium')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'create_engines.smokeAudit', 'true'
            // Sodium's jar is an early service jar: FML must see it before mod discovery, so it goes on the boot classpath
            additionalRuntimeClasspathConfiguration.extendsFrom(configurations.sodiumRuntime)
        }

        // JEI and EMI rows: the same audit with one recipe viewer loaded, which also checks that the viewer found this
        // mod's plugin and was given every refining route.
        smokeAuditJei {
            client()
            gameDirectory = file('run/smoke-client-jei')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'create_engines.smokeAudit', 'true'
            systemProperty 'create_engines.smokeAudit.requireViewer', 'jei'
        }

        smokeAuditEmi {
            client()
            gameDirectory = file('run/smoke-client-emi')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'create_engines.smokeAudit', 'true'
            systemProperty 'create_engines.smokeAudit.requireViewer', 'emi'
        }

        // KubeJS and CC: Tweaked rows: the same audit with the other mod loaded, which also checks that this mod's plugin or
        // peripheral was found and works
        smokeAuditKubejs {
            client()
            gameDirectory = file('run/smoke-client-kubejs')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'create_engines.smokeAudit', 'true'
            systemProperty 'create_engines.smokeAudit.requireIntegration', 'kubejs'
        }

        smokeAuditCc {
            client()
            gameDirectory = file('run/smoke-client-cc')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'create_engines.smokeAudit', 'true'
            systemProperty 'create_engines.smokeAudit.requireIntegration', 'computercraft'
        }

        // Curios row: the same audit with Curios loaded, which also puts the headphones in its head slot and checks that they
        // count as worn and muffle
        smokeAuditCurios {
            client()
            gameDirectory = file('run/smoke-client-curios')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'create_engines.smokeAudit', 'true'
            systemProperty 'create_engines.smokeAudit.requireIntegration', 'curios'
        }

        // Jade, Iris, Sound Physics Remastered and AmbientSounds rows: the same audit with the other mod loaded
        smokeAuditJade {
            client()
            gameDirectory = file('run/smoke-client-jade')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'create_engines.smokeAudit', 'true'
            systemProperty 'create_engines.smokeAudit.requireIntegration', 'jade'
        }

        smokeAuditIris {
            client()
            gameDirectory = file('run/smoke-client-iris')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'create_engines.smokeAudit', 'true'
            systemProperty 'create_engines.smokeAudit.requireIntegration', 'iris'
            // Iris draws through Sodium, whose jar is an early service jar (see smokeAuditSodium)
            additionalRuntimeClasspathConfiguration.extendsFrom(configurations.sodiumRuntime)
        }

        smokeAuditSoundPhysics {
            client()
            gameDirectory = file('run/smoke-client-sound-physics')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'create_engines.smokeAudit', 'true'
            systemProperty 'create_engines.smokeAudit.requireIntegration', 'sound_physics_remastered'
        }

        smokeAuditAmbientSounds {
            client()
            gameDirectory = file('run/smoke-client-ambient-sounds')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'create_engines.smokeAudit', 'true'
            systemProperty 'create_engines.smokeAudit.requireIntegration', 'ambientsounds'
        }

        // Create Aeronautics row: the same audit with Aeronautics (and Sable) loaded
        smokeAuditAeronautics {
            client()
            gameDirectory = file('run/smoke-client-aeronautics')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'create_engines.smokeAudit', 'true'
            systemProperty 'create_engines.smokeAudit.requireIntegration', 'aeronautics'
        }

        // A normal playable client with Aeronautics (and Sable) loaded, for hands-on testing (no smoke or showcase harness)
        clientAeronautics {
            client()
            gameDirectory = file('run/client-aeronautics')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // The showcase with Aeronautics loaded, in a game folder of its own; its mods folder is filled by the run task
        showcaseAeronautics {
            client()
            gameDirectory = file('run/showcase-aeronautics')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'create_engines.showcase', 'true'
            systemProperty 'create_engines.showcase.set', project.hasProperty('showcaseSet') ? project.property('showcaseSet') : 'engines'
            systemProperty 'create_engines.showcase.trailerShots', project.hasProperty('trailerShots') ? project.property('trailerShots') : ''
            programArguments.addAll '--width', '1920', '--height', '1080'
        }

        // Builds a handful of engines on stone pads and photographs them at 1920x1080 for the mod page, in a game
        // folder of its own so it neither shares nor disturbs the settings of a development client.
        showcase {
            client()
            gameDirectory = file('run/showcase')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'create_engines.showcase', 'true'
            systemProperty 'create_engines.showcase.set', project.hasProperty('showcaseSet') ? project.property('showcaseSet') : 'engines'
            systemProperty 'create_engines.showcase.trailerShots', project.hasProperty('trailerShots') ? project.property('trailerShots') : ''
            programArguments.addAll '--width', '1920', '--height', '1080'
        }

        // The showcase with shaders, for the trailer: Iris (which draws through Sodium, see smokeAuditIris) and the shader pack in
        // tools/trailer/shaderpacks, in a game folder of its own; its mods folder, options and Iris settings are written by the run task
        showcaseShaders {
            client()
            gameDirectory = file('run/showcase-shaders')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'create_engines.showcase', 'true'
            systemProperty 'create_engines.showcase.set', project.hasProperty('showcaseSet') ? project.property('showcaseSet') : 'engines'
            systemProperty 'create_engines.showcase.trailerShots', project.hasProperty('trailerShots') ? project.property('trailerShots') : ''
            programArguments.addAll '--width', '1920', '--height', '1080'
            additionalRuntimeClasspathConfiguration.extendsFrom(configurations.sodiumRuntime)
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            // Its own folder: shipped default settings, and a log no other run overwrites
            gameDirectory = file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // The GameTests again with Pollution of the Realms loaded, for the tests that only run with it; its jars are put in the
        // game folder's mods folder by the doFirst below
        gameTestServerPollution {
            type = 'gameTestServer'
            gameDirectory = file('run/gametest-pollution')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // The GameTests with Create Crafts & Additions loaded (Mekanism and Create: New Age were tried and left out, see docs/COMPAT.md), for the tests that run an alternator into
        // those mods' own energy blocks. The blocks to try are named here and put in the world by EnergyCompatGameTests.
        gameTestServerEnergy {
            type = 'gameTestServer'
            gameDirectory = file('run/gametest-energy')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'create_engines.energySinks',
                'createaddition:modular_accumulator,createaddition:electric_motor'
        }

        // The GameTests with Create: The Factory Must Grow loaded, for TfmgCompatGameTests (its fluids burn as the fuels they are tagged as)
        gameTestServerTfmg {
            type = 'gameTestServer'
            gameDirectory = file('run/gametest-tfmg')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'create_engines.requireTfmg', 'true'
        }

        // The GameTests with Create Aeronautics and Sable loaded, for the tests that need a moving structure
        gameTestServerSable {
            type = 'gameTestServer'
            gameDirectory = file('run/gametest-sable')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Create ships Registrate, Ponder and Flywheel in its own jar, so we compile against
    // the slim jar and pull the libraries in explicitly.
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    localRuntime("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    sodiumRuntime("net.caffeinemc:sodium-neoforge:${sodium_version}") { transitive = false }

    // Recipe viewer plugins (client/compat) compile against the APIs and ship none of them
    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}") { transitive = false }
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}") { transitive = false }
    compileOnly("dev.emi:emi-neoforge:${emi_version}:api") { transitive = false }
    jeiRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    emiRuntime("dev.emi:emi-neoforge:${emi_version}") { transitive = false }

    // The script and computer integrations likewise compile against the APIs and ship none of them
    compileOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") { transitive = false }
    compileOnly("dev.latvian.mods:rhino:${rhino_version}") { transitive = false }
    compileOnly("cc.tweaked:cc-tweaked-${minecraft_version}-core-api:${cc_tweaked_version}") { transitive = false }
    compileOnly("cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cc_tweaked_version}") { transitive = false }
    kubejsRuntime("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") { transitive = false }
    kubejsRuntime("dev.latvian.mods:rhino:${rhino_version}") { transitive = false }
    ccRuntime("cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cc_tweaked_version}") { transitive = false }
    compileOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}:api") { transitive = false }
    curiosRuntime("top.theillusivec4.curios:curios-neoforge:${curios_version}") { transitive = false }
    // Jade: compiled against for the overlay (compat/jade), never shipped; the Jade row loads it
    compileOnly("maven.modrinth:jade:${jade_version}") { transitive = false }
    jadeRuntime("maven.modrinth:jade:${jade_version}") { transitive = false }
    irisRuntime("maven.modrinth:iris:${iris_version}") { transitive = false }
    soundPhysicsRuntime("maven.modrinth:sound-physics-remastered:${sound_physics_version}") { transitive = false }
    soundPhysicsRuntime("maven.modrinth:cloth-config:${cloth_config_version}") { transitive = false }
    ambientSoundsRuntime("maven.modrinth:ambientsounds:${ambient_sounds_version}") { transitive = false }
    ambientSoundsRuntime("maven.modrinth:creativecore:${creative_core_version}") { transitive = false }
    energyRuntime("maven.modrinth:createaddition:${create_additions_version}") { transitive = false }
    tfmgRuntime("maven.modrinth:tfmg-community-edition:${tfmg_version}") { transitive = false }
    aeronauticsRuntime("maven.modrinth:create-aeronautics:${aeronautics_version}") { transitive = false }
    aeronauticsRuntime("maven.modrinth:sable:${sable_version}") { transitive = false }
    // Pollution of the Realms has no API: its classes are compiled against (never shipped) and only one bridge class names them
    compileOnly("maven.modrinth:pollution-of-the-realms:${pollution_version}") { transitive = false }
    compileOnly("maven.modrinth:forgeendertech:${endertech_version}") { transitive = false }
    pollutionRuntime("maven.modrinth:pollution-of-the-realms:${pollution_version}") { transitive = false }
    pollutionRuntime("maven.modrinth:forgeendertech:${endertech_version}") { transitive = false }
    // Sable's small companion library (nested inside its jar) is compiled against, never shipped; only SableBridge names it
    compileOnly(files(layout.buildDirectory.file('sable/sable-companion.jar')).builtBy('extractSableCompanion'))
    compileOnly("maven.modrinth:sable:${sable_version}") { transitive = false }

    // The simulation core has no Minecraft dependencies and is tested as plain Java.
    testImplementation(platform('org.junit:junit-bom:5.11.4'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
    testImplementation('com.google.code.gson:gson:2.10.1')
}

tasks.named('test', Test) {
    // PackagedJarTest reads the jar a player would get, so it is built first and its path handed over
    dependsOn 'jar'
    systemProperty 'ce.jar', tasks.named('jar', Jar).get().archiveFile.get().asFile.path
    useJUnitPlatform()
    // Separate JVMs, not in-JVM parallelism: the tests share static caches (CylinderSpec.GEOMETRIES, CamProfile.CURVES) and
    // some reset them on purpose, so classes must not share a JVM at the same time. Four forks keep the timing-sensitive tests
    // (perf budgets, concurrency) from fighting over cores.
    maxParallelForks = 4
    testLogging {
        events 'failed'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_min_version        : neo_min_version,
            loader_version_range   : loader_version_range,
            create_version_range   : create_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Smoke verification. The game cannot judge its own run: it does not see errors printed while it shuts down, a crash
// leaves no report, and the GameTest server exits 0 whether its tests passed or not. These tasks read what a run left
// behind and fail the build. SmokeVerify is plain Java, so it runs on the main classes alone with no game.
def verifyOutput = sourceSets.main.output
def smokeAllowlist = file('src/smoke/log-allowlist.txt')

tasks.register('verifyClientSmoke', JavaExec) {
    group = 'verification'
    description = 'Fails unless the last smokeAudit run completed with no failed checks and a clean log.'
    classpath = verifyOutput
    mainClass = 'com.createengines.smoke.SmokeVerify'
    args '--run', 'client', '--dir', file('run/smoke-client/smoke/client').path,
            '--log', file('run/smoke-client/logs/latest.log').path, '--allow', smokeAllowlist.path
    dependsOn 'classes'
}

tasks.register('verifyGameTests', JavaExec) {
    group = 'verification'
    description = 'Fails unless the last runGameTestServer passed every test and logged no errors.'
    classpath = verifyOutput
    mainClass = 'com.createengines.smoke.SmokeVerify'
    args '--run', 'gametest', '--gametest', '--log', file('run/gametest/logs/latest.log').path, '--allow', smokeAllowlist.path
    dependsOn 'classes'
}

// A run that dies before it writes anything must not be judged by what the run before it left behind, so each starts by
// deleting the last one's report, log and crash reports. (Plain java.io here: the configuration cache forbids
// project access at execution time.)
def smokeClientDir = file('run/smoke-client')
def gameTestDir = file('run/gametest')

tasks.matching { it.name == 'runSmokeAudit' }.configureEach {
    timeout = java.time.Duration.ofMinutes(30)
    finalizedBy 'verifyClientSmoke'
    doFirst {
        new File(smokeClientDir, 'smoke').deleteDir()
        new File(smokeClientDir, 'crash-reports').deleteDir()
        new File(smokeClientDir, 'logs/latest.log').delete()
    }
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    timeout = java.time.Duration.ofMinutes(20)
    finalizedBy 'verifyGameTests'
    doFirst {
        new File(gameTestDir, 'smoke').deleteDir()
        new File(gameTestDir, 'crash-reports').deleteDir()
        new File(gameTestDir, 'logs/latest.log').delete()
    }
}

// The older screenshot runs write no report and share run/ with a development client, so their log is only advice: problems
// show as warnings and never fail the build.
tasks.register('verifyVisualSmoke', JavaExec) {
    group = 'verification'
    description = 'Scans the log of the last runVisualSmokeTest for errors, as warnings only.'
    classpath = verifyOutput
    mainClass = 'com.createengines.smoke.SmokeVerify'
    args '--run', 'visual', '--log-only', '--lenient-log', '--log', file('run/logs/latest.log').path, '--allow', smokeAllowlist.path
    dependsOn 'classes'
}
tasks.matching { it.name == 'runVisualSmokeTest' }.configureEach { finalizedBy 'verifyVisualSmoke' }

// Compatibility-matrix rows (docs/COMPAT.md, verification track item 10): the client audit again with Flywheel off and with
// Sodium loaded, each judged by the same verifier and allow-list as the main run. A row is green only when its verify
// task passes. ./gradlew compatMatrix runs every row.
[[name: 'FlywheelOff', dir: 'run/smoke-client-flywheel-off', flywheel: 'flywheel:off'],
 [name: 'Sodium', dir: 'run/smoke-client-sodium', flywheel: null],
 [name: 'Jei', dir: 'run/smoke-client-jei', flywheel: null, mods: 'jeiRuntime'],
 [name: 'Emi', dir: 'run/smoke-client-emi', flywheel: null, mods: 'emiRuntime'],
 [name: 'Kubejs', dir: 'run/smoke-client-kubejs', flywheel: null, mods: 'kubejsRuntime'],
 [name: 'Cc', dir: 'run/smoke-client-cc', flywheel: null, mods: 'ccRuntime'],
 [name: 'Curios', dir: 'run/smoke-client-curios', flywheel: null, mods: 'curiosRuntime'],
 [name: 'Jade', dir: 'run/smoke-client-jade', flywheel: null, mods: 'jadeRuntime'],
 [name: 'Iris', dir: 'run/smoke-client-iris', flywheel: null, mods: 'irisRuntime'],
 [name: 'SoundPhysics', dir: 'run/smoke-client-sound-physics', flywheel: null, mods: 'soundPhysicsRuntime'],
 [name: 'AmbientSounds', dir: 'run/smoke-client-ambient-sounds', flywheel: null, mods: 'ambientSoundsRuntime'],
 [name: 'Aeronautics', dir: 'run/smoke-client-aeronautics', flywheel: null, mods: 'aeronauticsRuntime']].each { row ->
    def rowDir = file(row.dir)
    // A recipe viewer is an ordinary mod: its jars go in the row's mods folder, which FML scans (on the classpath they are not found)
    def rowMods = row.mods ? configurations.getByName(row.mods).incoming.files : null
    def verifyName = "verifyClientSmoke${row.name}"
    tasks.register(verifyName, JavaExec) {
        group = 'verification'
        description = "Fails unless the last runSmokeAudit${row.name} completed with no failed checks and a clean log."
        classpath = verifyOutput
        mainClass = 'com.createengines.smoke.SmokeVerify'
        args '--run', "client-${row.name}", '--dir', new File(rowDir, 'smoke/client').path,
                '--log', new File(rowDir, 'logs/latest.log').path, '--allow', smokeAllowlist.path
        dependsOn 'classes'
    }
    tasks.matching { it.name == "runSmokeAudit${row.name}" }.configureEach {
        timeout = java.time.Duration.ofMinutes(30)
        finalizedBy verifyName
        doFirst {
            new File(rowDir, 'smoke').deleteDir()
            new File(rowDir, 'crash-reports').deleteDir()
            new File(rowDir, 'logs/latest.log').delete()
            if (rowMods != null) {
                def modsDir = new File(rowDir, 'mods')
                modsDir.deleteDir()
                modsDir.mkdirs()
                rowMods.files.each { jar -> new File(modsDir, jar.name).bytes = jar.bytes }
            }
            if (row.flywheel != null) {
                // Flywheel reads its backend from its own config file; seed it so this row starts with the backend off
                def config = new File(rowDir, 'config')
                config.mkdirs()
                new File(config, 'flywheel-client.toml').text = "backend = \"${row.flywheel}\"\n"
            }
        }
    }
}

