// One command for everything unattended: unit tests, the GameTests with their log check, and the client audit.
tasks.register('smoke') {
    group = 'verification'
    description = 'Runs unit tests, GameTests and the client audit, each verified, with coverage; fails if any of them found a problem or the combined coverage fell.'
    dependsOn 'test', 'runGameTestServer', 'runSmokeAudit', 'coverageMerged'
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach { mustRunAfter 'test' }
tasks.matching { it.name == 'runSmokeAudit' }.configureEach { mustRunAfter 'runGameTestServer' }

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Verification track item 12: coverage with a ratchet. The report is a map of code no test runs; the check fails only if
// the total drops below the number recorded in src/smoke/coverage-floor.txt, which is raised by hand when it improves.
// That floor measures the unit tests alone, over the mod's own classes and not the test harness (and is what CI's `check` holds). The GameTests and the client audit run in
// other JVMs, so they carry the JaCoCo agent too and `coverageMerged` below joins all three into one report and a second
// ratchet, src/smoke/coverage-floor-merged.txt.
jacoco {
    toolVersion = '0.8.12'
}

tasks.named('test', Test) {
    finalizedBy 'jacocoTestReport'
}

tasks.named('jacocoTestReport', JacocoReport) {
    reports {
        xml.required = true
        html.required = true
    }
}

// The test harness (the GameTests, the smoke audit, the showcase and visual smoke classes) is left out of both ratchets: it is test
// code that no unit test runs and that grows with every GameTest, so counting it made the unit floor fall as the mod was tested more.
def harnessPackages = ['com/createengines/gametest/**', 'com/createengines/smoke/**', 'com/createengines/client/smoke/**',
    'com/createengines/client/VisualSmokeTest*', 'com/createengines/client/ShowcaseRun*']
def coverageFloorFile = file('src/smoke/coverage-floor.txt')

tasks.register('coverageRatchet', JacocoCoverageVerification) {
    group = 'verification'
    description = 'Fails if instruction coverage of the unit tests (the mod itself, not the test harness) falls below src/smoke/coverage-floor.txt.'
    dependsOn 'test'
    executionData.from(tasks.named('test').map { it.extensions.getByType(JacocoTaskExtension).destinationFile })
    classDirectories.from(files(sourceSets.main.output.classesDirs.files.collect { fileTree(dir: it, exclude: harnessPackages) }))
    sourceDirectories.from(sourceSets.main.allJava.srcDirs)
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = new BigDecimal(coverageFloorFile.text.trim())
            }
        }
    }
}

tasks.named('check') { dependsOn 'coverageRatchet' }

// The merged half of item 12. The GameTest server and the client audit each write build/jacoco/<task>.exec, limited to this
// mod's own classes (the agent would otherwise instrument Minecraft and NeoForge too). The audit's harness packages are
// left out of the measure on every side, so the number says how much of the mod runs and not how much of the test code does.
def coverageRuns = ['test', 'runGameTestServer', 'runSmokeAudit']
['runGameTestServer', 'runSmokeAudit'].each { runName ->
    tasks.matching { it.name == runName }.configureEach { runTask ->
        jacoco.applyTo(runTask)
        def agent = runTask.extensions.getByType(JacocoTaskExtension)
        agent.includes = ['com.createengines.*']
        // The agent appends to its file (Gradle 9 has no switch for it), and a run is judged by its own coverage, not by every run
        // since the last clean: so the old file goes first. Plain java.io, as above, for the configuration cache.
        def execFile = agent.destinationFile
        runTask.doFirst { execFile.delete() }
    }
}
def mergedExecutionData = files(coverageRuns.collect { layout.buildDirectory.file("jacoco/${it}.exec").get().asFile }).filter { it.exists() }
def mergedClasses = files(sourceSets.main.output.classesDirs.files.collect { fileTree(dir: it, exclude: harnessPackages) })

tasks.register('coverageMergedReport', JacocoReport) {
    group = 'verification'
    description = 'Coverage of the unit tests, the GameTests and the client audit together (build/reports/jacoco/merged).'
    executionData.from(mergedExecutionData)
    classDirectories.from(mergedClasses)
    sourceDirectories.from(sourceSets.main.allJava.srcDirs)
    reports {
        xml.required = true
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/merged')
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/merged/merged.xml')
    }
}

def mergedFloorFile = file('src/smoke/coverage-floor-merged.txt')

tasks.register('coverageMerged', JacocoCoverageVerification) {
    group = 'verification'
    description = 'Runs the unit tests, the GameTests and the client audit with coverage and fails if their combined instruction coverage falls below src/smoke/coverage-floor-merged.txt.'
    dependsOn 'test', 'runGameTestServer', 'runSmokeAudit'
    finalizedBy 'coverageMergedReport'
    executionData.from(mergedExecutionData)
    classDirectories.from(mergedClasses)
    sourceDirectories.from(sourceSets.main.allJava.srcDirs)
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = new BigDecimal(mergedFloorFile.text.trim())
            }
        }
    }
}

// Verification track item 1: mutation testing of the simulation. PIT changes the code in small ways (a flipped
// comparison, a dropped term) and reruns the tests; a mutant no test kills is an assertion that never bites.
// ./gradlew pitest writes build/reports/pitest/mutations.xml and index.html, and fails if more mutants live than
// src/smoke/mutation-ratchet.txt allows. The ratchet is lowered by hand as survivors are killed, never raised.
// Run through PIT's command line, not its Gradle plugin, which does not work with Gradle 9. The slow fuzz and timing
// tests are left out of the mutant runs (each mutant would repeat their whole length); the fast tests that name exact
// values are what a mutant has to get past.
configurations {
    pitest
}

dependencies {
    pitest platform('org.junit:junit-bom:5.11.4')
    pitest 'org.junit.platform:junit-platform-launcher'
    pitest 'org.pitest:pitest-command-line:1.17.4'
    pitest 'org.pitest:pitest-junit5-plugin:1.2.1'
}

def pitestReports = layout.buildDirectory.dir('reports/pitest')
def survivorLimitFile = file('src/smoke/mutation-ratchet.txt')

tasks.register('pitest', JavaExec) {
    group = 'verification'
    description = 'Mutation-tests com.createengines.engine.sim and fails if more mutants live than the ratchet allows.'
    dependsOn 'testClasses'
    classpath = configurations.pitest
    mainClass = 'org.pitest.mutationtest.commandline.MutationCoverageReport'
    def testClasspath = sourceSets.test.runtimeClasspath
    def sourceDirs = sourceSets.main.allJava.srcDirs
    doFirst {
        args '--reportDir', pitestReports.get().asFile.path,
                '--targetClasses', 'com.createengines.engine.sim.*',
                '--targetTests', 'com.createengines.engine.sim.*',
                '--excludedClasses', 'com.createengines.engine.sim.*Test,com.createengines.engine.sim.*Test$*',
                '--excludedTestClasses', 'com.createengines.engine.sim.SimStressTest,com.createengines.engine.sim.PerfBudgetTest,com.createengines.engine.sim.ConfigMatrixTest,com.createengines.engine.sim.SimPropertyTest',
                '--sourceDirs', sourceDirs.collect { it.path }.join(','),
                '--classPath', testClasspath.files.collect { it.path }.join(','),
                '--outputFormats', 'XML,HTML',
                '--threads', '4',
                '--timeoutConst', '10000',
                '--timestampedReports=false',
                '--failWhenNoMutations=false'
    }
    doLast {
        def xml = pitestReports.get().file('mutations.xml').asFile
        if (!xml.exists())
            throw new GradleException('PIT wrote no ' + xml)
        def text = xml.getText('UTF-8')
        def survived = (text =~ /status='SURVIVED'/).count
        def noCoverage = (text =~ /status='NO_COVERAGE'/).count
        def killed = (text =~ /status='KILLED'/).count
        def limit = survivorLimitFile.text.trim() as int
        println "PIT: killed ${killed}, survived ${survived}, no test reaches ${noCoverage} (limit ${limit})"
        if (survived + noCoverage > limit)
            throw new GradleException("PIT: ${survived + noCoverage} mutants live, more than the ${limit} allowed by ${survivorLimitFile.name}")
    }
}
