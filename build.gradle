    doFirst {
        def gameDir = showcaseShadersDir
        def packs = showcaseShaderPacks.files.sort()
        if (packs.isEmpty())
            throw new GradleException('no shader pack in tools/trailer/shaderpacks (see tools/trailer/shaderpacks/README.txt)')
        def modsDir = new File(gameDir, 'mods')
        modsDir.deleteDir()
        modsDir.mkdirs()
        irisShowcaseMods.files.each { jar -> new File(modsDir, jar.name).bytes = jar.bytes }
        if (showcaseWithAeronautics)
            showcaseAeronauticsJars.files.each { jar -> new File(modsDir, jar.name).bytes = jar.bytes }
        def packsDir = new File(gameDir, 'shaderpacks')
        packsDir.deleteDir()
        packsDir.mkdirs()
        new File(packsDir, packs[0].name).bytes = packs[0].bytes
        def config = new File(gameDir, 'config')
        config.mkdirs()
        new File(config, 'iris.properties').text = "enableShaders=true\nshaderPack=${packs[0].name}\n"
        new File(gameDir, 'options.txt').text = showcaseShaderOptions.text
    }
}

