// The showcase with shaders: Iris goes in the game folder's mods folder (Sodium is on the classpath), the first shader pack of
// tools/trailer/shaderpacks is switched on in Iris's settings, and the options are the trailer's (sound off, a short render distance)
def irisShowcaseMods = configurations.getByName('irisRuntime').incoming.files
// Resolved here, not inside the task's closure: the configuration cache does not allow the build script's own methods at run time
def showcaseShadersDir = file('run/showcase-shaders')
def showcaseShaderPacks = fileTree(dir: 'tools/trailer/shaderpacks', include: '*.zip')
def showcaseShaderOptions = file('tools/trailer/options.txt')
// -PwithAeronautics also puts Create Aeronautics and Sable (and their jars of Simulated and Offroad) in the mods folder, for the trailer's wheeled car
